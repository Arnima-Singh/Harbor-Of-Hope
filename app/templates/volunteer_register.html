
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration | Harbor Of Hope</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .volunteer-container {
            max-width: 550px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .volunteer-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .volunteer-container p {
            text-align: center;
            color: #666;
        }

        .volunteer-container label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        .volunteer-container input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .volunteer-container button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #26734d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="volunteer-container">
{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <p style="
            padding: 12px;
            border-radius: 8px;
            background: {% if category == 'success' %}#d4edda{% else %}#f8d7da{% endif %};
            color: {% if category == 'success' %}#155724{% else %}#721c24{% endif %};
        ">
            {{ message }}
        </p>
    {% endfor %}
{% endwith %}

    <h1>Become a Volunteer 🐾</h1>

    <p>Join Harbor Of Hope and help animals in need.</p>

    <form method="POST" action="{{ url_for('main.volunteer_register') }}">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="location">Your Location</label>
        <input type="text" id="location" name="location" required>

        <label for="password">Create Password</label>
        <input type="password" id="password" name="password"
               minlength="8" required>

        <button type="submit">Register as Volunteer</button>

    </form>

</div>

</body>
</html>
